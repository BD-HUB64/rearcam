<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>후방카메라</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#dfe8f5;font:16px -apple-system,"Apple SD Gothic Neo",sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#st{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));text-align:center;color:#ffd58a;text-shadow:0 1px 3px #000;z-index:3}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);z-index:4}
button{font:inherit;color:#e8f0ff;background:#1c2740;border:1px solid #3a4b70;border-radius:10px;padding:12px 18px}
button.big{background:#2c5da8;border-color:#6aa3ff;font-size:20px;padding:16px 28px}
</style></head><body>
<img id="v" alt="">
<div id="st">아래 [연결] 버튼을 누르세요</div>
<div id="bar">
 <button class="big" id="go">연결</button>
 <button id="q" style="display:none">화면 작게/크게</button>
 <button id="m" style="display:none">좌우 반전</button>
</div>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',IMG='6e400003-b5a3-f393-e0a9-e50e24dcca9e',CTL='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const v=document.getElementById('v'),st=document.getElementById('st');
let parts=[],expect=0,got=0,bad=0,size=0,frames=0,t0=Date.now(),ctl=null,mir=false,lvl=0;
const LV=[[5,24],[3,20],[1,16]]; // 320x240 / 240x176 / 160x120
function onData(e){
  const d=new Uint8Array(e.target.value.buffer);
  const f=d[0];
  if(f===1){expect=d[1]|(d[2]<<8)|(d[3]<<16);got=d.length-4;parts=[d.slice(4)]}
  else if(f===0){got+=d.length-1;parts.push(d.slice(1))}
  else if(f===2){
    if(got!==expect){bad++;parts=[];st.textContent='깨진 그림 버림 '+bad+'회';return}   // 중간에 빠진 조각이 있으면 보여 주지 않는다
    const b=new Blob(parts,{type:'image/jpeg'});parts=[];
    const u=URL.createObjectURL(b),old=v.src;v.src=u;if(old.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(old),500);
    frames++;const s=(Date.now()-t0)/1000;
    st.textContent='v2 초당 '+(frames/s).toFixed(1)+'장 (버린 그림 '+bad+')';
    if(s>3){t0=Date.now();frames=0}
  }
}
document.getElementById('go').onclick=async()=>{
  try{
    st.textContent='찾는 중…';
    const dev=await navigator.bluetooth.requestDevice({filters:[{name:'RearCam'}],optionalServices:[SVC]});
    dev.addEventListener('gattserverdisconnected',()=>{st.textContent='끊김. [연결]을 다시 누르세요'});
    const g=await dev.gatt.connect(),s=await g.getPrimaryService(SVC);
    const ic=await s.getCharacteristic(IMG);ctl=await s.getCharacteristic(CTL);
    ic.addEventListener('characteristicvaluechanged',onData);
    await ic.startNotifications();
    st.textContent='연결됨';
    document.getElementById('go').style.display='none';
    document.getElementById('q').style.display='';document.getElementById('m').style.display='';
  }catch(err){st.textContent='실패: '+err.message}
};
document.getElementById('q').onclick=()=>{if(!ctl)return;lvl=(lvl+1)%LV.length;ctl.writeValue(new Uint8Array(LV[lvl]))};
document.getElementById('m').onclick=()=>{mir=!mir;v.style.transform='scaleX('+(mir?-1:1)+')'};
if(!navigator.bluetooth){st.textContent='이 브라우저는 블루투스를 지원하지 않습니다. Bluefy 앱에서 여세요.'}
</script></body></html>
